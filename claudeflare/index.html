<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BL Ranking — Holograma</title>
<style>
  :root{
    --cyan:#33f3ff;
    --cyan-soft: rgba(51,243,255,.45);
    --red:#ff3355;
    --bg-1:#050a12;
    --bg-2:#0a1622;
    --silver-1:#eef2f5;
    --silver-2:#8c98a3;
    --gold-1:#f3d98a;
    --gold-2:#7a5a1e;
    --bronze-1:#e3a878;
    --bronze-2:#6b3f22;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:var(--bg-1);
    font-family:'Arial Narrow', Arial, sans-serif;
    overflow-x:hidden;
  }
  body{ padding-top:64px; }
  .scene{
    position:relative;
    width:100%;
    height:calc(100vh - 64px);
    min-height:600px;
    scroll-margin-top:64px;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(51,243,255,.10), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(255,51,85,.08), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    overflow: hidden;
  }

  .floor-clip{
    position:absolute; inset:0;
    overflow:hidden;
    perspective: 620px;
  }
  .floor{
    position:absolute;
    left:-60%; top:26%;
    width:220%; height:130%;
    background-image:
      repeating-linear-gradient(0deg, rgba(51,243,255,.5) 0 1.5px, transparent 1.5px 58px),
      repeating-linear-gradient(90deg, rgba(51,243,255,.5) 0 1.5px, transparent 1.5px 58px);
    transform: rotateX(62deg);
    filter: drop-shadow(0 0 5px rgba(51,243,255,.55));
    mask-image: linear-gradient(180deg, transparent 0%, black 18%, black 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 18%, black 75%, transparent 100%);
  }

  .rig{ position:absolute; inset:0; pointer-events:none; }
  .part{
    position:absolute;
    border:1.5px solid var(--cyan-soft);
    box-shadow: 0 0 10px rgba(51,243,255,.35), inset 0 0 8px rgba(51,243,255,.15);
    transform-origin:center;
    animation: retractExtend 3.2s ease-in-out infinite;
  }
  .part.red{ border-color: rgba(255,51,85,.55); box-shadow:0 0 10px rgba(255,51,85,.35), inset 0 0 8px rgba(255,51,85,.15); }
  .p1{ width:64px; height:64px; top:6%;  left:5%;  animation-delay:.0s; }
  .p2{ width:38px; height:38px; top:14%; left:13%; animation-delay:.5s; }
  .p3{ width:26px; height:26px; top:22%; left:8%;  animation-delay:1.0s; }
  .p4{ width:50px; height:50px; top:66%; left:88%; animation-delay:.3s; }
  .p5{ width:30px; height:30px; top:78%; left:92%; animation-delay:1.4s; }
  .p6{ width:20px; height:20px; top:8%;  left:90%; animation-delay:.8s; }

  @keyframes retractExtend{
    0%, 100%{ transform: scale(1) rotate(0deg); opacity:.9; }
    50%{ transform: scale(.35) rotate(18deg); opacity:.45; }
  }

  .laser{
    position:absolute;
    top:52%; left:-10%;
    width:120%; height:2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow:0 0 14px 2px rgba(255,51,85,.6);
    transform: rotate(-7deg);
  }

  .crosshatch{
    position:absolute;
    top:-6%; right:-8%;
    width:46%; height:34%;
    background-image: repeating-linear-gradient(45deg, rgba(51,243,255,.28) 0 2px, transparent 2px 11px);
    -webkit-mask-image: linear-gradient(225deg, black 0%, black 35%, transparent 75%);
    mask-image: linear-gradient(225deg, black 0%, black 35%, transparent 75%);
    transform: rotate(-2deg);
  }
  .flat-grid{
    position:absolute;
    top:4%; left:-4%;
    width:40%; height:56%;
    background-image:
      repeating-linear-gradient(0deg, rgba(51,243,255,.14) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(51,243,255,.14) 0 1px, transparent 1px 32px);
    -webkit-mask-image: radial-gradient(ellipse at 30% 30%, black 0%, transparent 68%);
    mask-image: radial-gradient(ellipse at 30% 30%, black 0%, transparent 68%);
  }
  .chevrons{
    position:absolute;
    display:flex; gap:5px;
    top:40%; left:7%;
    opacity:.55;
  }
  .chevrons span{
    width:0; height:0;
    border-top:9px solid transparent;
    border-bottom:9px solid transparent;
    border-left:15px solid var(--cyan);
    filter: drop-shadow(0 0 4px rgba(51,243,255,.65));
  }
  .side-rail{
    position:absolute;
    top:10%; right:4%;
    width:10px; height:64%;
    background: repeating-linear-gradient(0deg, rgba(51,243,255,.4) 0 2px, transparent 2px 24px);
    opacity:.5;
  }
  .rail-dot{
    position:absolute; right:1.2%;
    width:9px; height:9px;
    border-radius:50%;
    border:1.5px solid var(--cyan);
    box-shadow:0 0 6px rgba(51,243,255,.6);
    opacity:.6;
  }
  .rd1{ top:14%; } .rd2{ top:38%; } .rd3{ top:62%; } .rd4{ top:84%; }
  .frame{
    position:absolute; inset:16px;
    border:1.5px solid rgba(51,243,255,.22);
    pointer-events:none;
  }
  .frame::before, .frame::after{
    content:"";
    position:absolute;
    width:22px; height:22px;
    border:2px solid var(--cyan);
    opacity:.6;
  }
  .frame::before{ top:-2px; left:-2px; border-right:none; border-bottom:none; }
  .frame::after{ bottom:-2px; right:-2px; border-left:none; border-top:none; }

  .navbar{
    position:fixed;
    top:0; left:0; right:0;
    height:64px;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:0 10px;
    background:linear-gradient(180deg, rgba(5,10,18,.94), rgba(5,10,18,.78));
    border-bottom:1.5px solid rgba(51,243,255,.25);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .nav-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border:1.5px solid transparent;
    background:transparent;
    clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);
    cursor:pointer;
    text-decoration:none;
    transition: transform .3s cubic-bezier(.2,.85,.25,1.35), border-color .3s ease, background .3s ease, box-shadow .3s ease;
  }
  .nav-item::after{
    content:"";
    position:absolute;
    left:50%; bottom:1px;
    width:0; height:2px;
    background:var(--cyan);
    box-shadow:0 0 9px 1px rgba(51,243,255,.85);
    transition: width .3s ease, left .3s ease;
  }
  .nav-icon{
    width:19px; height:19px;
    flex:0 0 auto;
    color:var(--cyan-soft);
    perspective:200px;
    transition: color .3s ease, filter .3s ease;
  }
  .nav-icon svg{
    width:100%; height:100%;
    display:block;
    overflow:visible;
    transform-style:preserve-3d;
    transition: transform .48s cubic-bezier(.3,.65,.2,1);
  }
  .nav-label{
    font-weight:800;
    font-style:italic;
    letter-spacing:1.5px;
    font-size:12.5px;
    color:var(--silver-1);
    transition: color .3s ease, text-shadow .3s ease;
    white-space:nowrap;
  }
  .nav-item:hover, .nav-item:focus-visible{
    border-color:var(--cyan);
    background:rgba(51,243,255,.10);
    transform: scale(1.14);
    box-shadow:0 0 18px rgba(51,243,255,.45), inset 0 0 10px rgba(51,243,255,.18);
    z-index:2;
    outline:none;
  }
  .nav-item:hover::after, .nav-item:focus-visible::after{ width:74%; left:13%; }
  .nav-item:hover .nav-label, .nav-item:focus-visible .nav-label{
    color:var(--cyan);
    text-shadow:0 0 8px rgba(51,243,255,.75);
  }
  .nav-item:hover .nav-icon, .nav-item:focus-visible .nav-icon{ color:var(--cyan); }
  .nav-item:hover .nav-icon svg, .nav-item:focus-visible .nav-icon svg{
    transform: rotateY(180deg) translateX(-3px);
    filter: drop-shadow(0 0 6px rgba(51,243,255,.85));
  }

  @media (max-width:640px){
    .navbar{ gap:1px; padding:0 4px; }
    .nav-item{ padding:8px 8px; gap:5px; }
    .nav-label{ font-size:10px; letter-spacing:1px; }
    .nav-icon{ width:16px; height:16px; }
  }

  .info-section{
    position:relative;
    min-height:100vh;
    padding:96px 20px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
      radial-gradient(ellipse at 50% 10%, rgba(51,243,255,.08), transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border-top:1.5px solid rgba(51,243,255,.18);
    scroll-margin-top:64px;
  }
  .info-icon{
    width:64px; height:64px;
    color:var(--cyan);
    filter:drop-shadow(0 0 12px rgba(51,243,255,.55));
    margin-bottom:18px;
    animation: retractExtend 3.2s ease-in-out infinite;
  }
  .info-title{
    font-size:26px;
    font-weight:900;
    font-style:italic;
    letter-spacing:2px;
    color:#f3fbff;
    text-shadow:0 0 12px rgba(51,243,255,.5);
    margin:0 0 10px;
  }
  .info-tag{
    font-size:12px;
    font-weight:800;
    letter-spacing:3px;
    color:var(--cyan);
    border:1.5px solid var(--cyan);
    background:rgba(51,243,255,.08);
    padding:5px 16px;
    clip-path: polygon(6% 0,100% 0,94% 100%,0 100%);
  }

  .logo-watermark{
    position:absolute;
    top:50%; left:50%;
    width:min(52vw, 640px);
    min-width:300px;
    transform:translate(-50%,-50%);
    opacity:.16;
    pointer-events:none;
    z-index:0;
  }
  .logo-watermark svg{ display:block; width:100%; height:auto; overflow:visible; }
  .logo-rotor{
    transform-origin:150px 150px;
    animation: slowSpin 26s linear infinite;
  }
  @keyframes slowSpin{ to{ transform:rotate(360deg); } }

  .board{
    position:absolute;
    top:50%; left:50%;
    width:min(600px, 92vw);
    transform: translate(-50%,-50%) rotate(-7deg) skewY(-1.2deg);
    max-height: 85vh;
    overflow-y: auto;
    padding-right: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--cyan) transparent;
  }
  .board::-webkit-scrollbar{ width:5px; }
  .board::-webkit-scrollbar-thumb{ background:var(--cyan-soft); border-radius:3px; }

  .dial{
    position:absolute;
    top:-16px; left:14px;
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid var(--cyan);
    box-shadow:0 0 10px rgba(51,243,255,.65);
  }
  .dial::after{
    content:"";
    position:absolute; inset:5px;
    border-radius:50%;
    border:1px solid rgba(51,243,255,.55);
  }
  .plate-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }

  .badge{
    flex:0 0 auto;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, #0d2530, #06131a);
    border:2px solid var(--cyan);
    box-shadow:0 0 10px rgba(51,243,255,.55), inset 0 0 6px rgba(51,243,255,.35);
    transform: rotate(45deg);
    animation: retractExtend 3.2s ease-in-out infinite;
  }
  .badge span{
    transform: rotate(-45deg);
    color:var(--cyan);
    font-weight:800;
    font-style:italic;
    font-size:15px;
    text-shadow:0 0 6px rgba(51,243,255,.8);
  }

  .icon-slot{
    position:relative;
    flex:0 0 auto;
    width:32px; height:32px;
  }
  .icon-slot .pent-border, .icon-slot .pent-fill{
    position:absolute;
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  }
  .icon-slot .pent-border{
    inset:0;
    background: var(--cyan);
    box-shadow:0 0 9px rgba(51,243,255,.6);
  }
  .icon-slot .pent-fill{
    inset:2px;
    background: linear-gradient(160deg, #0d2530, #06131a);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    line-height:1.1;
    color:var(--cyan);
    font-style:normal;
    font-weight:700;
    font-size:5px;
    letter-spacing:-.2px;
    padding-top:3px;
    overflow: hidden;
  }

  .name-plate, .header-plate{
    flex:1 1 auto;
    position:relative;
    padding:9px 18px;
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
    font-weight:800;
    font-style:italic;
    letter-spacing:1px;
    color:#171310;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 10px rgba(0,0,0,.55);
  }
  .header-plate{
    justify-content:center;
    background:linear-gradient(180deg, var(--silver-1), var(--silver-2));
    font-size:20px;
    letter-spacing:3px;
    color:#101418;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .name-plate .name{ font-size:16px; }
  .name-plate .yen{
    font-style:normal;
    font-weight:700;
    font-size:14px;
    background:rgba(255,255,255,.55);
    padding:2px 8px;
    border-radius:2px;
    color:#101418;
  }
  .gold{ background:linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
  .silver{ background:linear-gradient(180deg, var(--silver-1), var(--silver-2)); }
  .bronze{ background:linear-gradient(180deg, var(--bronze-1), var(--bronze-2)); }
  .plain{
    background:linear-gradient(180deg, #1b2a34, #0c161c);
    color:var(--cyan);
    border:1px solid rgba(51,243,255,.4);
  }
  .plain .yen{
    background:rgba(51,243,255,.14);
    color:var(--cyan);
  }

  .divider-line{
    height:2px;
    margin:2px 0 12px 48px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow:0 0 10px rgba(255,51,85,.6);
  }

  .compact-section {
    margin-top: 18px;
    border-top: 1.5px solid rgba(51,243,255,.3);
    padding-top: 12px;
  }
  .compact-title {
    font-size: 10px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: 2px;
    color: var(--cyan-soft);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .compact-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--cyan-soft), transparent);
  }
  .compact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px 12px;
  }
  .compact-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 4px;
    font-size: 10px;
    font-weight: 700;
    font-style: italic;
    color: var(--silver-1);
    border-bottom: 1px solid rgba(51,243,255,.1);
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .compact-item:hover {
    background: rgba(51,243,255,.1);
    color: var(--cyan);
  }
  .compact-item .c-rank {
    color: var(--cyan);
    font-family: 'Courier New', monospace;
    font-weight: 800;
    font-size: 11px;
    width: 22px;
    text-shadow: 0 0 4px rgba(51,243,255,.5);
  }
  .compact-item .c-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .compact-item .c-yen {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--cyan);
    opacity: .9;
  }

  .add-btn{
    margin-top:6px;
    width:100%;
    padding:9px 14px;
    background:rgba(51,243,255,.08);
    border:1.5px dashed var(--cyan);
    color:var(--cyan);
    font-weight:800;
    font-style:italic;
    letter-spacing:1px;
    font-size:13px;
    cursor:pointer;
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
  }
  .add-btn:hover{ background:rgba(51,243,255,.18); box-shadow:0 0 12px rgba(51,243,255,.4); }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(3,7,12,.72);
    backdrop-filter: blur(2px);
    display:none;
    align-items:center; justify-content:center;
    z-index:10;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:min(360px, 88vw);
    background:linear-gradient(180deg, #0c1620, #070d14);
    border:1.5px solid var(--cyan);
    box-shadow:0 0 26px rgba(51,243,255,.35), 0 20px 40px rgba(0,0,0,.6);
    padding:20px 20px 18px;
  }
  .modal-card h3{
    margin:0 0 14px;
    color:var(--cyan);
    font-style:italic;
    letter-spacing:2px;
    font-size:16px;
    text-shadow:0 0 8px rgba(51,243,255,.6);
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block;
    font-size:11px;
    color:var(--cyan-soft);
    letter-spacing:1px;
    margin-bottom:4px;
  }
  .field input{
    width:100%;
    background:rgba(51,243,255,.06);
    border:1px solid rgba(51,243,255,.35);
    color:#eaf9ff;
    font-size:14px;
    padding:8px 10px;
    font-family:inherit;
  }
  .field input:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 8px rgba(51,243,255,.45); }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-actions button{
    flex:1;
    padding:9px 0;
    font-weight:800;
    font-style:italic;
    letter-spacing:1px;
    font-size:13px;
    cursor:pointer;
    border:1.5px solid var(--cyan);
  }
  .btn-ghost{ background:transparent; color:var(--cyan-soft); border-color:rgba(51,243,255,.35) !important; }
  .btn-solid{ background:var(--cyan); color:#04161c; }
  .btn-solid:hover{ box-shadow:0 0 14px rgba(51,243,255,.6); }

  .plate-row.clickable{ cursor:pointer; }
  .plate-row.clickable:hover .name-plate{ filter:brightness(1.12); }

  .detail-overlay{
    position:fixed; inset:0;
    background:rgba(2,5,9,.85);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display:flex;
    align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    pointer-events:none;
    transition: opacity .35s ease, visibility 0s linear .35s;
    z-index:20;
    padding:16px;
  }
  .detail-overlay.show{
    opacity:1; visibility:visible; pointer-events:auto;
    transition: opacity .35s ease;
  }

  .detail-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
  }

  .detail-big-image {
    position: absolute;
    top: 20px;
    bottom: 20px;
    left: 20px;
    right: 35%;         
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateX(-140px) scale(.85);
    transition: opacity 1.2s ease .1s,
                transform 1.2s cubic-bezier(.2,.85,.25,1.1);
    pointer-events: none;
    background: transparent;
    border: none;
    color: var(--cyan);
    font-weight: 700;
    font-size: 24px;
    text-align: center;
    z-index: 1;
  }
  .detail-overlay.show .detail-big-image {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }
  .detail-big-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;         
    background: transparent;
    -webkit-mask-image: linear-gradient(to right, black 55%, transparent 100%);
    mask-image: linear-gradient(to right, black 55%, transparent 100%);
    filter: drop-shadow(0 0 35px rgba(51,243,255,.35));
  }

  .detail-card{
    position:relative;
    display:flex;
    width:min(680px, 94vw);
    min-height:260px;
    background: rgba(11, 20, 29, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border:1.5px solid rgba(51,243,255,.55);
    box-shadow:
      0 0 42px rgba(51,243,255,.28),
      0 25px 60px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(51,243,255,.15);
    overflow:hidden;
    flex: 0 0 auto;
    z-index: 2;
    border-radius: 6px;
  }

  .detail-close{
    position:absolute; top:8px; right:8px;
    width:26px; height:26px;
    border:1.5px solid var(--cyan);
    background:rgba(51,243,255,.08);
    color:var(--cyan);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    z-index:2;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .detail-close:hover{ box-shadow:0 0 10px rgba(51,243,255,.6); }

  .detail-image{
    flex:0 0 42%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(45deg, rgba(51,243,255,.06) 0 2px, transparent 2px 10px),
      radial-gradient(ellipse at 40% 30%, rgba(51,243,255,.12), transparent 65%),
      rgba(6, 12, 18, 0.65);
    border-right:1.5px solid rgba(51,243,255,.35);
    transform: translateX(-75%) scale(.3);
    opacity:0;
    transition: transform .55s cubic-bezier(.2,.85,.25,1.3), opacity .4s ease;
  }

    var rest = entries.slice(topCount);

    var html = '';
    top.forEach(function(e, i){
      var rank = i + 1;
      if(rank === 4){
        html += '<div class="divider-line"></div>';
      }
      var iconUrl = e.img || 'https://via.placeholder.com/64/0d2530/33f3ff?text=' + encodeURIComponent(e.name.slice(0,2));
      var bigUrl = e.bigImg || iconUrl;
      html += '' +
        '<div class="plate-row clickable" data-i="' + i + '" data-rank="' + rank + '" data-name="' + escapeHtml(e.name) + '" data-value="' + e.value + '" data-img="' + escapeHtml(iconUrl) + '" data-bigimg="' + escapeHtml(bigUrl) + '">' +
          '<div class="badge"><span>' + rank + '</span></div>' +
          '<div class="icon-slot">' +
            '<div class="pent-border"></div>' +
            '<div class="pent-fill" role="img" aria-label="icono">' +
              '<img src="' + iconUrl + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">' +
            '</div>' +
          '</div>' +
          '<div class="name-plate ' + tierClass(rank) + '">' +
            '<span class="name">' + escapeHtml(e.name) + '</span>' +
            '<span class="yen">¥ ' + Number(e.value).toLocaleString('es-MX') + '</span>' +
          '</div>' +
        '</div>';
    });

    if(rest.length > 0){
      html += '<div class="compact-section">';
      html += '<div class="compact-title">CLASIFICACIÓN COMPACTA · 24 — ' + (entries.length) + '</div>';
      html += '<div class="compact-grid">';

      rest.forEach(function(e, idx){
        var rank = topCount + idx + 1;
        var realIndex = topCount + idx;
        var iconUrl = e.img || 'https://via.placeholder.com/32/0d2530/33f3ff?text=' + encodeURIComponent(e.name.slice(0,2));
        var bigUrl = e.bigImg || iconUrl;
        html += '' +
          '<div class="compact-item" data-i="' + realIndex + '" data-rank="' + rank + '" data-name="' + escapeHtml(e.name) + '" data-value="' + e.value + '" data-img="' + escapeHtml(iconUrl) + '" data-bigimg="' + escapeHtml(bigUrl) + '">' +
            '<span class="c-rank">' + rank + '</span>' +
            '<span class="c-name">' + escapeHtml(e.name) + '</span>' +
            '<span class="c-yen">¥' + Number(e.value).toLocaleString('es-MX') + '</span>' +
          '</div>';
      });

      html += '</div></div>';
    }

    rowsEl.innerHTML = html;
  }

  rowsEl.addEventListener('click', function(ev){
    var row = ev.target.closest('.plate-row') || ev.target.closest('.compact-item');
    if(row){
      openDetail({
        rank: row.getAttribute('data-rank'),
        name: row.getAttribute('data-name'),
        value: row.getAttribute('data-value'),
        img: row.getAttribute('data-img') || '',
        bigImg: row.getAttribute('data-bigimg') || ''
      });
    }
  });

  var detailOverlay = document.getElementById('detailOverlay');
  var detailCloseBtn = document.getElementById('detailCloseBtn');
  var detailRankEl = document.getElementById('detailRank');
  var detailNameEl = document.getElementById('detailName');
  var detailYenEl = document.getElementById('detailYen');
  var detailIcon = document.getElementById('detailIcon');
  var detailBigImage = document.getElementById('detailBigImage');

  function openDetail(data){
    detailRankEl.textContent = String(data.rank).padStart(2, '0');
    detailNameEl.textContent = data.name;
    detailYenEl.textContent = '¥ ' + Number(data.value).toLocaleString('es-MX');

    var imgSrc = data.img;
    var bigImgSrc = data.bigImg || data.img;
    var altText = data.name.slice(0,2).toUpperCase();

    if (!imgSrc) {
      detailIcon.innerHTML = altText;
    } else {
      detailIcon.innerHTML = '<img src="' + imgSrc + '" alt="' + altText + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
    }

    if (!bigImgSrc) {
      detailBigImage.innerHTML = 'ALT: ' + altText;
      detailBigImage.style.fontSize = '24px';
    } else {
      detailBigImage.innerHTML = '<img src="' + bigImgSrc + '" alt="' + altText + '" style="width:100%;height:100%;object-fit:contain;display:block;background:transparent;">';
      detailBigImage.style.fontSize = '';
    }

    detailOverlay.classList.add('show');
  }
  function closeDetail(){ detailOverlay.classList.remove('show'); }

  detailCloseBtn.addEventListener('click', closeDetail);
  detailOverlay.addEventListener('click', function(ev){ if(ev.target === detailOverlay) closeDetail(); });
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeDetail(); });

  var playerForm = document.getElementById('playerForm');
  var playerNameInput = document.getElementById('playerName');
  var playerValueInput = document.getElementById('playerValue');
  var playerImgFileInput = document.getElementById('playerImgFile');
  var playerBigImgFileInput = document.getElementById('playerBigImgFile');
  var playerImgPreview = document.getElementById('playerImgPreview');
  var playerBigImgPreview = document.getElementById('playerBigImgPreview');
  var playerFormTitle = document.getElementById('playerFormTitle');
  var playerSubmitBtn = document.getElementById('playerSubmitBtn');
  var playerCancelBtn = document.getElementById('playerCancelBtn');
  var playersGrid = document.getElementById('playersGrid');
  var editIndex = -1;
  var currentImgData = '';
  var currentBigImgData = '';

  function readImageFile(fileInput, previewEl, onDone){
    var file = fileInput.files && fileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      onDone(e.target.result);
      previewEl.src = e.target.result;
      previewEl.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  playerImgFileInput.addEventListener('change', function(){
    readImageFile(playerImgFileInput, playerImgPreview, function(dataUrl){ currentImgData = dataUrl; });
  });
  playerBigImgFileInput.addEventListener('change', function(){
    readImageFile(playerBigImgFileInput, playerBigImgPreview, function(dataUrl){ currentBigImgData = dataUrl; });
  });

  function renderPlayers(){
    var sorted = entries
      .map(function(e, i){ return { entry: e, index: i }; })
      .sort(function(a, b){ return a.entry.name.localeCompare(b.entry.name, 'es'); });

    if(sorted.length === 0){
      playersGrid.innerHTML = '<p class="player-empty">No hay jugadores registrados todavía.</p>';
      return;
    }

    var html = '';
    sorted.forEach(function(item){
      var e = item.entry;
      var i = item.index;
      var iconUrl = e.img || 'https://via.placeholder.com/48/0d2530/33f3ff?text=' + encodeURIComponent(e.name.slice(0,2));
      html += '' +
        '<div class="player-card">' +
          '<img class="player-card-img" src="' + iconUrl + '" alt="">' +
          '<div class="player-card-info">' +
            '<div class="player-card-name">' + escapeHtml(e.name) + '</div>' +
            '<div class="player-card-value">¥ ' + Number(e.value).toLocaleString('es-MX') + '</div>' +
          '</div>' +
          '<div class="player-card-actions">' +
            '<button type="button" class="player-edit-btn" data-i="' + i + '">Editar</button>' +
            '<button type="button" class="player-del-btn" data-i="' + i + '">Eliminar</button>' +
          '</div>' +
        '</div>';
    });
    playersGrid.innerHTML = html;
  }

  function startEdit(i){
    editIndex = i;
    var e = entries[i];
    playerNameInput.value = e.name;
    playerValueInput.value = e.value;
    playerImgFileInput.value = '';
    playerBigImgFileInput.value = '';
    currentImgData = e.img || '';
    currentBigImgData = e.bigImg || '';
    if(currentImgData){ playerImgPreview.src = currentImgData; playerImgPreview.style.display = 'block'; }
    else{ playerImgPreview.style.display = 'none'; }
    if(currentBigImgData){ playerBigImgPreview.src = currentBigImgData; playerBigImgPreview.style.display = 'block'; }
    else{ playerBigImgPreview.style.display = 'none'; }
    playerFormTitle.textContent = 'EDITAR JUGADOR';
    playerSubmitBtn.textContent = 'Actualizar';
    playerCancelBtn.style.display = 'inline-block';
    playerNameInput.focus();
  }

  function resetPlayerForm(){
    editIndex = -1;
    playerForm.reset();
    currentImgData = '';
    currentBigImgData = '';
    playerImgPreview.style.display = 'none';
    playerBigImgPreview.style.display = 'none';
    playerFormTitle.textContent = 'NUEVO JUGADOR';
    playerSubmitBtn.textContent = 'Agregar';
    playerCancelBtn.style.display = 'none';
  }

  playersGrid.addEventListener('click', function(ev){
    var editBtn = ev.target.closest('.player-edit-btn');
    if(editBtn){
      startEdit(parseInt(editBtn.getAttribute('data-i'), 10));
      return;
    }
    var delBtn = ev.target.closest('.player-del-btn');
    if(delBtn){
      var i = parseInt(delBtn.getAttribute('data-i'), 10);
      if(confirm('¿Eliminar a ' + entries[i].name + ' del ranking?')){
        entries.splice(i, 1);
        saveEntries();
        renderRanking();
        renderPlayers();
        if(editIndex === i) resetPlayerForm();
      }
    }
  });

  playerCancelBtn.addEventListener('click', resetPlayerForm);

  playerForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    var name = playerNameInput.value.trim();
    var value = parseFloat(playerValueInput.value);
    var img = currentImgData;
    var bigImg = currentBigImgData;
    if(!name || isNaN(value) || value < 0) return;

    if(!img){
      img = 'https://via.placeholder.com/64/0d2530/33f3ff?text=' + encodeURIComponent(name.slice(0,2).toUpperCase());
    }

    if(editIndex >= 0){
      entries[editIndex].name = name.toUpperCase();
      entries[editIndex].value = value;
      entries[editIndex].img = img;
      entries[editIndex].bigImg = bigImg;
    } else {
      entries.push({ name: name.toUpperCase(), value: value, img: img, bigImg: bigImg });
    }

    saveEntries();
    renderRanking();
    renderPlayers();
    resetPlayerForm();
  });

  var exportJsonBtn = document.getElementById('exportJsonBtn');
  var importJsonFile = document.getElementById('importJsonFile');

  exportJsonBtn.addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'players.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importJsonFile.addEventListener('change', function(){
    var file = importJsonFile.files && importJsonFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var data;
      try{
        data = JSON.parse(e.target.result);
      }catch(err){
        alert('El archivo no es un JSON válido.');
        importJsonFile.value = '';
        return;
      }
      if(!Array.isArray(data)){
        alert('El JSON debe ser una lista de jugadores.');
        importJsonFile.value = '';
        return;
      }
      var valid = data.every(function(e){
        return e && typeof e.name === 'string' && typeof e.value === 'number';
      });
      if(!valid){
        alert('Cada jugador debe tener al menos "name" (texto) y "value" (número).');
        importJsonFile.value = '';
        return;
      }
      if(!confirm('Esto reemplazará el ranking actual con ' + data.length + ' jugador(es) del archivo. ¿Continuar?')) {
        importJsonFile.value = '';
        return;
      }
      entries = data;
      saveEntries();
      renderRanking();
      renderPlayers();
      resetPlayerForm();
      importJsonFile.value = '';
    };
    reader.readAsText(file);
  });

  renderRanking();
  renderPlayers();

  document.querySelectorAll('.nav-item').forEach(function(item){
    item.addEventListener('click', function(ev){
      ev.preventDefault();
      var id = item.getAttribute('data-target');
      var target = document.getElementById(id);
      if(target){ target.scrollIntoView({ behavior:'smooth', block:'start' }); }
    });
  });
</script>
</body>
</html>
